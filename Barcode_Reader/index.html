<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Generator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f6f9;
}

.container{
    width:90%;
    max-width:450px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

.input-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    margin-top:10px;
}

.generate-btn{
    background:#2563eb;
    color:white;
}

.download-btn{
    background:#16a34a;
    color:white;
}

#qrContainer{
    margin-top:25px;
    display:flex;
    justify-content:center;
}

#qrContainer canvas{
    border:1px solid #ddd;
    padding:10px;
    border-radius:10px;
}
</style>
</head>
<body>

<div class="container">

    <h1>QR Generator</h1>

    <div class="input-group">
        <label>Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter Name">
    </div>

    <div class="input-group">
        <label>Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter Email">
    </div>

    <button
        class="generate-btn"
        id="generateBtn">
        Generate QR
    </button>

    <div id="qrContainer"></div>

    <button
        class="download-btn"
        id="downloadBtn">
        Download PDF
    </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>

const generateBtn =
document.getElementById("generateBtn");

const downloadBtn =
document.getElementById("downloadBtn");

const qrContainer =
document.getElementById("qrContainer");

generateBtn.addEventListener(
    "click",
    async () => {

        const name =
        document.getElementById("name").value.trim();

        const email =
        document.getElementById("email").value.trim();

        if(!name || !email){
            alert("Please enter name and email");
            return;
        }

        const qrData = JSON.stringify({
            name:name,
            email:email
        });

        qrContainer.innerHTML = "";

        const canvas =
        document.createElement("canvas");

        await QRCode.toCanvas(
            canvas,
            qrData,
            {
                width:250
            }
        );

        qrContainer.appendChild(canvas);
    }
);

downloadBtn.addEventListener(
    "click",
    () => {

        const canvas =
        document.querySelector("#qrContainer canvas");

        if(!canvas){
            alert("Generate QR First");
            return;
        }

        const imageData =
        canvas.toDataURL("image/png");

        const { jsPDF } = window.jspdf;

        const pdf = new jsPDF();

        pdf.setFontSize(18);

        pdf.text(
            "Generated QR Code",
            20,
            20
        );

        pdf.addImage(
            imageData,
            "PNG",
            20,
            35,
            80,
            80
        );

        pdf.save("qr-code.pdf");
    }
);

</script>

</body>
</html>
